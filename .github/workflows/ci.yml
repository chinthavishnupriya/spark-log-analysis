name: Spark Log Analysis CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - name: Set up SBT
        uses: sbt/setup-sbt@v1

      - name: Compile project
        run: sbt compile

      - name: Run tests
        run: sbt test
